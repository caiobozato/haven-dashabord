services:
  haven:
    build: .
    image: haven:latest
    container_name: haven
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Reach Home Assistant by its LAN address; "localhost" inside this
      # container is the container itself.
      HAVEN_DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
